version: "3.8"

services:
  db:
    image: postgres:17-bookworm
    container_name: telelog_postgres_db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telelog_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: telelog_web_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-telemetry}
    networks:
      - telelog_network
    depends_on:
      db:
        condition: service_healthy    

  worker:
    build: .
    restart: always
    # 🚀 Run the worker loop as the primary execution process inside this container instance
    command: python -m app.workers.worker
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-telemetry}
    networks:
      - telelog_network
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  telelog_network:
    driver: bridge